<script>
// ===================================
// イベント内成績（リーダーボード形式）
// ===================================
var currentStatsSort = 'matchPoints'; // デフォルト: 勝ち点ランキング
var cachedStatsData = [];
var cachedMvpData = [];

/**
 * ランキング基準を切り替える（常に降順）
 * @param {string} key - ソートキー
 */
function sortStatsBy(key) {
  currentStatsSort = key;
  renderStatsBoard();
}

function toggleStatsDetail(el) {
  el.classList.toggle('expanded');
}

/** MVP結果データからレーティング・評価コメント・称号を取得 */
function getMvpDataForMember_(memberId) {
  var item = cachedMvpData.find(function(r) { return r['メンバーID'] === memberId; });
  if (!item) return null;
  return {
    rating: Number(item['レーティング']) || 0,
    comment: item['評価コメント'] || '',
    title: item['称号'] || ''
  };
}

function renderEventStats() {
  var c = document.getElementById('event-stats');
  var members = currentMembers;

  // 準備中の場合はガイドメッセージを表示
  if (currentEventStatus === '準備中') {
    var msg = isAdmin()
      ? '準備ができたら、ステータスを「進行中」に変更してください'
      : 'イベントが開始されるまでお待ちください';
    c.innerHTML = '<div class="empty-state">' +
      '<svg aria-hidden="true" style="width:48px;height:48px;stroke:var(--border);fill:none;stroke-width:1.5;" viewBox="0 0 24 24">' +
      '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>' +
      '<p>' + esc(msg) + '</p></div>';
    return;
  }

  if (!members || members.length === 0) {
    c.innerHTML = '<div class="empty-state">' +
      '<svg aria-hidden="true" style="width:48px;height:48px;stroke:var(--border);fill:none;stroke-width:1.5;" viewBox="0 0 24 24">' +
      '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>' +
      '<p>メンバーを登録してください</p></div>';
    return;
  }

  // 全マッチをフラットに収集
  var allMatches = [];
  if (cachedRounds) {
    cachedRounds.forEach(function(r) {
      if (r.matches) r.matches.forEach(function(m) {
        allMatches.push({ match: m, roundNumber: r.roundNumber });
      });
    });
  }

  // 成績データを計算
  cachedStatsData = members.map(function(m) {
    var mId = m['メンバーID'];
    var wins = 0, losses = 0, draws = 0, played = 0, totalGoals = 0;
    var matchDetails = [];

    allMatches.forEach(function(item) {
      var match = item.match;
      var inA = match.teamA.find(function(p) { return p.id === mId; });
      var inB = match.teamB.find(function(p) { return p.id === mId; });
      if (!inA && !inB) return;
      played++;
      var result = '進行中';
      var goalCount = 0;

      if (match.status === '終了') {
        var sA = Number(match.scoreA), sB = Number(match.scoreB);
        if (sA === sB) { draws++; result = '引分'; }
        else if ((inA && sA > sB) || (inB && sB > sA)) { wins++; result = '勝ち'; }
        else { losses++; result = '負け'; }
      }

      if (match.memberGoals) {
        var g = match.memberGoals.find(function(g) { return g.memberId === mId; });
        if (g) { goalCount = Number(g.count); totalGoals += goalCount; }
      } else if (match.goals) {
        goalCount = match.goals.filter(function(g) { return g.memberId === mId && g.type === '通常'; }).length;
        totalGoals += goalCount;
      }

      matchDetails.push({
        roundNumber: item.roundNumber,
        matchNumber: match.matchNumber,
        result: result,
        goals: goalCount,
        scoreA: match.scoreA,
        scoreB: match.scoreB,
        teamAName: match.teamAName || 'チームA',
        teamBName: match.teamBName || 'チームB',
        myTeam: inA ? 'A' : 'B'
      });
    });

    var mvpInfo = getMvpDataForMember_(mId);
    return {
      id: mId,
      name: m['名前'],
      played: played,
      wins: wins,
      losses: losses,
      draws: draws,
      goals: totalGoals,
      matchPoints: wins * 3 + draws,
      winRate: played > 0 ? Math.round((wins / played) * 100) : 0,
      matchDetails: matchDetails,
      rating: mvpInfo ? mvpInfo.rating : 0,
      comment: mvpInfo ? mvpInfo.comment : '',
      title: mvpInfo ? mvpInfo.title : ''
    };
  });

  renderStatsBoard();
}

/**
 * リーダーボード形式で成績を描画する
 * テーブルヘッダーをタップでソート切り替え
 */
function renderStatsBoard() {
  var c = document.getElementById('event-stats');
  var stats = cachedStatsData.slice();

  // ソート（常に降順）
  var key = currentStatsSort;
  stats.sort(function(a, b) {
    var va = a[key] || 0, vb = b[key] || 0;
    if (vb !== va) return vb - va;
    // セカンダリソート: 勝ち点 → 得点
    if (key !== 'matchPoints' && b.matchPoints !== a.matchPoints) return b.matchPoints - a.matchPoints;
    return b.goals - a.goals;
  });

  // チップのアクティブ表示
  function chipClass(k) { return k === currentStatsSort ? 'lb-chip active' : 'lb-chip'; }

  // MVP列を表示するか
  var showRating = cachedMvpData && cachedMvpData.length > 0 && cachedMvpData.some(function(r) { return Number(r['レーティング']) > 0; });
  var ratingChip = showRating ? '<button class="' + chipClass('rating') + '" onclick="sortStatsBy(\'rating\')">📊 Rating</button>' : '';

  // 列の並び順を動的に構成（ソート中の値を名前の直後に配置）
  var columns = [
    { key: 'matchPoints', label: 'Pts', tdClass: 'lb-td-pts' },
    { key: 'played', label: 'P', tdClass: '' },
    { key: 'wins', label: 'W', tdClass: 'lb-td-win' },
    { key: 'draws', label: 'D', tdClass: 'lb-td-draw' },
    { key: 'losses', label: 'L', tdClass: 'lb-td-loss' },
    { key: 'goals', label: '⚽', tdClass: 'lb-td-goals' }
  ];
  if (showRating) {
    columns.push({ key: 'rating', label: 'Rtg', tdClass: 'lb-td-rating' });
  }

  // ソート中のカラムを先頭に移動
  var sortIdx = -1;
  for (var ci = 0; ci < columns.length; ci++) {
    if (columns[ci].key === currentStatsSort) { sortIdx = ci; break; }
  }
  if (sortIdx > 0) {
    var sortCol = columns.splice(sortIdx, 1)[0];
    columns.unshift(sortCol);
  }

  // ヘッダー生成
  var thHtml = columns.map(function(col) {
    var cls = col.key === currentStatsSort ? ' class="lb-th-active"' : '';
    return '<th' + cls + '>' + col.label + '</th>';
  }).join('');

  var colCount = columns.length + 2; // +2 for # and 名前

  var h = '<div class="lb-chips">' +
    '<button class="' + chipClass('matchPoints') + '" onclick="sortStatsBy(\'matchPoints\')">🏆 勝ち点</button>' +
    '<button class="' + chipClass('goals') + '" onclick="sortStatsBy(\'goals\')">⚽ 得点</button>' +
    ratingChip +
    '</div>' +
    '<div class="lb-wrap">' +
    '<table class="lb-table">' +
    '<thead><tr>' +
    '<th class="lb-th-rank">#</th>' +
    '<th class="lb-th-name">名前</th>' +
    thHtml +
    '</tr></thead><tbody>';

  h += stats.map(function(s, i) {
    var rank = i + 1;
    var rankDisplay = '';
    if (rank === 1) rankDisplay = '🥇';
    else if (rank === 2) rankDisplay = '🥈';
    else if (rank === 3) rankDisplay = '🥉';
    else rankDisplay = rank;

    var rowClass = rank <= 3 ? ' lb-row-top' + rank : '';

    // 各カラムのセル生成
    var tdHtml = columns.map(function(col) {
      var val = col.key === 'rating' ? (s.rating > 0 ? s.rating.toFixed(1) : '-') : (s[col.key] || 0);
      var cls = col.tdClass;
      if (col.key === currentStatsSort) cls += ' lb-td-sorted';
      return '<td' + (cls ? ' class="' + cls.trim() + '"' : '') + '>' + val + '</td>';
    }).join('');

    var detailHtml = buildStatsDetailHtml_(s);

    return '<tr class="lb-row' + rowClass + '" onclick="toggleLbRow(this)">' +
      '<td class="lb-td-rank">' + rankDisplay + '</td>' +
      '<td class="lb-td-name"><span class="lb-name">' + esc(s.name) + '</span></td>' +
      tdHtml +
      '</tr>' +
      '<tr class="lb-detail-row"><td colspan="' + colCount + '">' +
      '<div class="lb-detail">' + detailHtml + '</div></td></tr>';
  }).join('');

  h += '</tbody></table></div>';
  c.innerHTML = h;
}

/**
 * リーダーボード行の展開/折りたたみ
 */
function toggleLbRow(tr) {
  tr.classList.toggle('lb-row-expanded');
  var detailRow = tr.nextElementSibling;
  if (detailRow) detailRow.classList.toggle('lb-detail-row-open');
}

/**
 * 個人の試合詳細HTMLを生成する
 * @param {Object} s - スタッツデータ
 * @return {string} HTML文字列
 */
function buildStatsDetailHtml_(s) {
  if (s.matchDetails.length === 0 && !s.title && !s.comment) {
    return '<div class="stats-empty-detail">まだ試合に出場していません</div>';
  }

  var matchRows = s.matchDetails.map(function(md) {
    var resultClass = md.result === '勝ち' ? 'stats-match-win' : (md.result === '負け' ? 'stats-match-lose' : (md.result === '引分' ? 'stats-match-draw' : ''));
    var resultBadge = '<span class="stats-match-result ' + resultClass + '">' + md.result + '</span>';
    return '<div class="stats-match-row">' +
      '<span class="stats-match-label">R' + md.roundNumber + '-M' + md.matchNumber + '</span>' +
      resultBadge +
      '<span>' + svg(IC.goal, 12) + ' ' + md.goals + '</span>' +
      '<span class="stats-match-score">' + md.scoreA + '-' + md.scoreB + '</span>' +
      '</div>';
  }).join('');

  var aiHtml = '';
  if (s.title || s.comment) {
    aiHtml = '<div class="stats-ai-section">' +
      (s.title ? '<div class="stats-ai-title">🏅 ' + esc(s.title) + '</div>' : '') +
      (s.comment ? '<div class="stats-ai-comment-text">' + esc(s.comment) + '</div>' : '') +
      '</div>';
  }

  return matchRows + aiHtml;
}

// ===================================
// MVP選出
// ===================================

function renderPostMatch(event, rounds, mvpResults) {
  var c = document.getElementById('post-match-content');
  var status = event['ステータス'] || '準備中';
  var hasMvpResults = mvpResults && mvpResults.length > 0;
  var isMvpConfirmed = String(event['MVP確定'] || '') === 'はい';
  var canSelectMvp = isAdmin() && status === 'イベント終了';

  var trophySvg = '<svg aria-hidden="true" style="width:48px;height:48px;stroke:var(--border);fill:none;stroke-width:1.5;" viewBox="0 0 24 24">' +
    '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 9 7 12 7s5-3 7.5-3a2.5 2.5 0 0 1 0 5H18"/>' +
    '<path d="M18 9v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9"/><path d="M12 7v14"/></svg>';

  // 一般メンバー: MVP未確定の場合はティーザー表示
  if (!isAdmin() && status === 'イベント終了' && !isMvpConfirmed) {
    var teaser = hasMvpResults
      ? '<div class="mvp-teaser">' +
        '<div class="mvp-teaser-icon">🏆</div>' +
        '<h3 class="mvp-teaser-title">MVP選出完了！</h3>' +
        '<p class="mvp-teaser-text">幹事が結果を確認中です…<br>もう少しだけお待ちください！</p>' +
        '<div class="mvp-teaser-dots"><span></span><span></span><span></span></div>' +
        '</div>'
      : '<div class="empty-state">' + trophySvg +
        '<p>お疲れさまでした！アンケートに回答して、MVP発表を待とう！</p></div>';
    c.innerHTML = teaser;
    return;
  }

  // イベント終了前の表示
  if (!hasMvpResults && !canSelectMvp) {
    var msg = '全試合終了後にMVP発表ができます。まずはピッチで暴れよう！';
    c.innerHTML = '<div class="empty-state">' + trophySvg + '<p>' + msg + '</p></div>';
    return;
  }

  var h = '';

  // 幹事向け: 操作パネル（選出 + 公開ステータスを一箇所にまとめる）
  if (canSelectMvp) {
    h += '<div class="mvp-admin-panel">' +
      '<div class="mvp-admin-panel-header">' +
        '<span class="mvp-admin-panel-label">⚙️ 幹事メニュー</span>' +
      '</div>' +
      '<div class="mvp-admin-panel-body">' +
        '<div class="mvp-admin-controls">' +
          '<div class="mvp-admin-inputs">' +
            '<label class="mvp-admin-input-label">MVP<input type="number" id="mvp-count" value="1" min="1" max="5" class="mvp-admin-input"></label>' +
            '<label class="mvp-admin-input-label">準MVP<input type="number" id="sub-mvp-count" value="1" min="0" max="5" class="mvp-admin-input"></label>' +
          '</div>' +
          '<button class="btn btn-primary" id="mvp-select-btn" onclick="runMvp()">' + svg(IC.trophy, 16) + ' 選出する</button>' +
        '</div>';

    // 公開ステータス（結果がある場合のみ表示）
    if (hasMvpResults) {
      if (!isMvpConfirmed) {
        h += '<div class="mvp-admin-status mvp-admin-status-private">' +
          '<span class="mvp-admin-status-indicator"></span>' +
          '<span class="mvp-admin-status-text">非公開</span>' +
          '<button class="mvp-admin-action-btn mvp-admin-action-publish" onclick="doConfirmMvp()">公開する 🎉</button>' +
        '</div>';
      } else {
        h += '<div class="mvp-admin-status mvp-admin-status-public">' +
          '<span class="mvp-admin-status-indicator"></span>' +
          '<span class="mvp-admin-status-text">公開中</span>' +
          '<button class="mvp-admin-action-btn mvp-admin-action-unpublish" onclick="doUnconfirmMvp()">非公開に戻す</button>' +
        '</div>';
      }
    }

    h += '</div></div>';
  }

  h += '<div id="mvp-results-area"></div>';

  c.innerHTML = h;
  if (hasMvpResults) renderMvpResults(mvpResults);

  // 選出中かどうかチェックしてUIを更新
  if (canSelectMvp) {
    checkMvpSelectingStatus_();
  }
}

var mvpLoadingTimer_ = null;

function runMvp() {
  var mc = document.getElementById('mvp-count').value;
  var sc = document.getElementById('sub-mvp-count').value;
  showConfirm('MVP選出', 'いよいよMVP発表！準備はいいですか？', function() {
    showLoading("ウェカピポ -SOUL'd OUT", "Yo! 俺がDiggy-MO'だぜ! 聴いてくれ");
    var lines = [
      'Nah ウェカピポ Yo!',
      '秘めた巨大なPower そびえたったTower',
      'アスファルトに網目状にひびが入るような地響き',
      'Metropolis apocalypse, oh! 大げさな黙示録とともに研ぎ澄ます',
      '鳥肌立つ だけど自らTuffに赴いてUrbanite',
      'わかってんじゃない? Ah!時は告げる 移ろう時代 世代に喝!',
      '見上げた空からのThunda a-yo! Wake up!',
      'その瞳も曇ってしまったLost generation',
      '失ってしまった愛という名のIllumination',
      '仮に別の愛という名のTemptation',
      'インチキな街 Just imitation でしょ?',
      'この場所に潤いをもう一度',
      'パンチを! 変わらないSituation',
      'そして胸の奥に秘めたSweetest emotion',
      'One time! Yo! Yo!',
      '荒 荒 荒波立つ ここはUrbanite ウェカピポ!',
      '若 若さの中 不確かな迷いとか ウェカピポ! O-oh!',
      '逆 逆 逆さまWorldの 孤独に強く ウェカピポ!',
      'まだ まだ 闘わねば 真実はどこだ',
      'Ah, ah, ah, ah-ah-ah, ah',
      'ｱ ｱﾗﾗﾗｧ ｱ ｱｧ'
    ];
    var lineIdx = 0;
    mvpLoadingTimer_ = setInterval(function() {
      if (lineIdx >= lines.length) { clearInterval(mvpLoadingTimer_); mvpLoadingTimer_ = null; return; }
      var el = document.getElementById('loading');
      var content = el.querySelector('.loading-content');
      var sub = content.querySelector('.loading-sub');
      if (!sub) { sub = document.createElement('p'); sub.className = 'loading-sub'; content.appendChild(sub); }
      sub.textContent = lines[lineIdx];
      lineIdx++;
    }, 2800);

    var clearMvpTimer = function() {
      if (mvpLoadingTimer_) { clearInterval(mvpLoadingTimer_); mvpLoadingTimer_ = null; }
    };

    google.script.run
      .withSuccessHandler(function(r) {
        if (r.success) {
          showToast(r.message);
          // ポーリング開始: 選出完了を待つ
          pollMvpSelection_(clearMvpTimer);
        } else {
          clearMvpTimer();
          hideLoading();
          showToast(r.message, true);
        }
      })
      .withFailureHandler(function() {
        clearMvpTimer();
        hideLoading();
        showToast('MVP選出に失敗しました', true);
      })
      .selectMVP(currentEventId, mc, sc);
  }, '発表する');
}

var mvpPollTimer_ = null;

/**
 * MVP選出完了をポーリングで待つ
 * @param {Function} clearMvpTimer - ローディング歌詞タイマーを止める関数
 */
function pollMvpSelection_(clearMvpTimer) {
  var pollInterval = 5000; // 5秒ごと
  var maxPolls = 60; // 最大5分
  var pollCount = 0;

  mvpPollTimer_ = setInterval(function() {
    pollCount++;
    if (pollCount > maxPolls) {
      clearInterval(mvpPollTimer_);
      mvpPollTimer_ = null;
      clearMvpTimer();
      hideLoading();
      showToast('MVP選出がタイムアウトしました。画面を更新してください。', true);
      return;
    }

    google.script.run
      .withSuccessHandler(function(status) {
        if (!status.selecting) {
          // 選出完了
          clearInterval(mvpPollTimer_);
          mvpPollTimer_ = null;
          clearMvpTimer();
          hideLoading();
          // 最新データを取得して画面を更新
          google.script.run
            .withSuccessHandler(function(detail) {
              if (detail && detail.mvpResults && detail.mvpResults.length > 0) {
                showToast('MVP選出が完了しました！');
                renderPostMatch(detail.event, detail.rounds, detail.mvpResults);
                renderEventStats();
              } else {
                showToast('MVP選出に失敗しました。再度お試しください。', true);
              }
            })
            .withFailureHandler(function() {
              showToast('結果の取得に失敗しました。画面を更新してください。', true);
            })
            .getEventDetail(currentEventId);
        }
      })
      .withFailureHandler(function() {
        // ポーリング失敗は無視して次回リトライ
      })
      .getMvpSelectionStatus(currentEventId);
  }, pollInterval);
}

/**
 * ページ読み込み時に選出中かチェックし、選出中ならボタンを無効化してポーリング開始
 */
function checkMvpSelectingStatus_() {
  google.script.run
    .withSuccessHandler(function(status) {
      if (status.selecting) {
        var btn = document.getElementById('mvp-select-btn');
        if (btn) {
          btn.disabled = true;
          btn.textContent = '⏳ 選出中…';
        }
        // ローディング表示してポーリング開始
        showLoading('MVP選出中', 'AIが評価しています…しばらくお待ちください');
        pollMvpSelection_(function() {});
      }
    })
    .withFailureHandler(function() {})
    .getMvpSelectionStatus(currentEventId);
}

/** MVP結果をメンバーに公開する */
function doConfirmMvp() {
  showConfirm('MVP公開', 'メンバーにMVP結果を公開します。よろしいですか？', function() {
    callServer('confirmMvp', [currentEventId], function(r) {
      showToast(r.message, !r.success);
      if (r.success) openEvent(currentEventId, 'tab-results');
    });
  }, '公開する');
}

/** MVP結果を非公開に戻す */
function doUnconfirmMvp() {
  showConfirm('非公開に戻す', 'MVP結果をメンバーから非表示にします。よろしいですか？', function() {
    callServer('unconfirmMvp', [currentEventId], function(r) {
      showToast(r.message, !r.success);
      if (r.success) openEvent(currentEventId, 'tab-results');
    });
  }, '非公開にする');
}

function renderMvpResults(results) {
  var c = document.getElementById('mvp-results-area');
  if (!results || results.length === 0) { c.innerHTML = ''; return; }
  var h = '<div class="mvp-results-header">🏆 MVP AWARD</div>';
  h += results.map(function(r) {
    var rank = r['順位'] || r.rank || '';
    var name = r['名前'] || r.name || '';
    var title = r['称号'] || r.title || '';
    var reason = r['理由'] || r.reason || '';
    var rating = r['レーティング'] || r.rating || 0;
    if (!rank) return '';
    var cc = rank === 'MVP' ? 'rank-mvp' : 'rank-sub';
    var badgeCls = rank === 'MVP' ? 'badge-mvp' : 'badge-sub';
    var rankLabel = rank === 'MVP' ? '🏆 MVP' : '🥈 準MVP';
    var titleHtml = title ? '<div class="mvp-result-title">「' + esc(title) + '」</div>' : '';
    var reasonHtml = reason ? '<div class="mvp-result-reason">' + esc(reason) + '</div>' : '';
    return '<div class="mvp-result-card ' + cc + '">' +
      '<div class="mvp-result-header">' +
        '<span class="mvp-result-rank-badge ' + badgeCls + '">' + rankLabel + '</span>' +
        '<span class="mvp-result-rating">⭐ ' + rating + '</span>' +
      '</div>' +
      '<div class="mvp-result-name">' + esc(name) + '</div>' +
      titleHtml +
      reasonHtml +
    '</div>';
  }).join('');
  c.innerHTML = h;
}
</script>
