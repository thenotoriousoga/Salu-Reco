<script>
// ===================================
// イベント一覧・詳細管理
// ===================================

// ===================================
// イベント一覧
// ===================================

/** イベント一覧を読み込む */
function loadEventList() {
  callServer('getEvents', [], function(events) {
    renderEventList(events);
  }, '読み込みエラー');
}

/**
 * イベント一覧を描画する
 * @param {Object[]} events - イベント配列
 */
function renderEventList(events) {
  var c = document.getElementById('event-list');
  if (!events || events.length === 0) {
    c.innerHTML = '<div class="empty-state">まだイベントがありません。最初の一歩を踏み出そう！</div>';
    return;
  }
  c.innerHTML = events.map(function(ev) {
    return eventItemHtml(ev, "openEvent('" + ev['イベントID'] + "')");
  }).join('');
}

// ===================================
// イベント詳細
// ===================================

/**
 * イベント詳細を開く
 * @param {string} eventId - イベントID
 * @param {string} [activeTab] - 初期表示タブ
 * @param {boolean} [skipHash] - URL更新をスキップするか
 */
function openEvent(eventId, activeTab, skipHash) {
  currentEventId = eventId;
  callServer('getEventDetail', [eventId], function(d) {
    if (!d) { showToast('イベントが見つかりません', true); return; }
    currentMembers = d.members;
    cachedRounds = d.rounds;
    var evStatus = (d.event['ステータス'] || '準備中');
    var isMvpConfirmed = String(d.event['MVP確定'] || '') === 'はい';
    // 一般メンバーにはMVP確定前の結果を見せない
    if (evStatus === 'イベント終了' && (isAdmin() || isMvpConfirmed)) {
      cachedMvpData = d.mvpResults || [];
    } else {
      cachedMvpData = [];
    }
    cachedSurveyVoters = d.surveyVoters || [];
    previewTeams = [];
    previewNames = [];
    renderEventDetail(d, activeTab);
    if (!skipHash) pushState_();
  }, 'エラー');
}

/**
 * イベント詳細を描画する
 * @param {Object} d - イベント詳細データ
 * @param {string} [activeTab] - 初期表示タブ
 */
function renderEventDetail(d, activeTab) {
  document.getElementById('event-list-view').style.display = 'none';
  document.getElementById('event-detail-view').style.display = 'block';

  // 一覧に戻るボタン: パスワードログインの管理者のみ表示（幹事は非表示）
  var navEl = document.querySelector('.ev-detail-nav');
  if (navEl) navEl.style.display = (isAdmin() && !currentMemberId) ? '' : 'none';

  var ev = d.event;
  currentEventStatus = ev['ステータス'] || '準備中';

  // タイトル（日付の横に参加コードを表示、タップでイベントURLをコピー）
  var titleH = '<svg class="section-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>' +
    '<line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ' +
    esc(ev['名称'] || '') + ' <span class="event-date" style="margin-left:8px;">' + esc(String(ev['日付'] || '')) + '</span>';
  if (ev['コード']) {
    titleH += '<span class="event-code-inline" onclick="copyEventUrl(\'' + esc(ev['コード']) + '\')" title="タップで招待URLをコピー" style="cursor:pointer;">' + esc(ev['コード']) + '</span>';
  }
  document.getElementById('ev-detail-title').innerHTML = titleH;

  // ステータスと遷移ボタン（管理者のみ）
  var statusH = statusBadgeHtml(ev['ステータス']);
  if (isAdmin()) {
    statusH += buildStatusButtons_(ev['ステータス']);
    var hint = buildStatusHint_(ev['ステータス']);
    if (hint) {
      statusH += '<div class="status-hint">' + svg(IC.info, 12) + ' ' + esc(hint) + '</div>';
    }
  }
  document.getElementById('ev-detail-status').innerHTML = statusH;

  // アンケートリンク（完了時以外）
  renderSurveyLink(ev);

  // 各セクションを描画
  renderMemberList(d.members, d.surveyVoters);
  renderRoundsList(d.rounds);
  renderPostMatch(ev, d.rounds, cachedMvpData);

  // ラウンド作成セクションの表示制御
  // 「進行中」かつ進行中ラウンドがない場合のみ表示
  var hasOngoing = (d.rounds || []).some(function(r) { return r.status !== '終了'; });
  var canCreateRound = currentEventStatus === '進行中' && !hasOngoing;
  var roundCreateEl = document.getElementById('round-create-section');
  roundCreateEl.style.cssText = canCreateRound ? '' : 'display:none!important';
  if (canCreateRound) {
    initSplitBoard();
  }

  switchTab(activeTab || 'tab-members');
}

/** イベント一覧に戻る */
function backToEventList() {
  document.getElementById('event-detail-view').style.display = 'none';
  document.getElementById('event-list-view').style.display = 'block';
  currentEventId = null;
  loadEventList();
  pushState_();
}

// ===================================
// ステータス遷移
// ===================================

/**
 * ステータスに応じた三点メニューのHTMLを生成する
 * @param {string} status - 現在のステータス
 * @return {string} メニューHTML
 */
function buildStatusButtons_(status) {
  var items = getStatusMenuItems_(status);
  if (items.length === 0) return '';

  var menuH = '<div class="status-menu-wrap">' +
    '<button class="status-menu-btn" onclick="toggleStatusMenu(event)" aria-label="ステータス操作">' +
    svg(IC.more, 16) + '</button>' +
    '<div class="status-menu" id="status-menu">';
  items.forEach(function(item) {
    var tooltip = item.tooltip ? ' title="' + esc(item.tooltip) + '"' : '';
    if (item.disabled) {
      // disabled属性を付けるとクリック・ホバーが拾えない端末があるため、
      // 見た目だけ無効化しつつクリック時はトーストで理由を案内する
      var tapAction = item.tooltip
        ? ' onclick="showDisabledReason_(event, \'' + esc(item.tooltip).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')"'
        : ' onclick="event.stopPropagation()"';
      menuH += '<button class="status-menu-item status-menu-item-disabled" aria-disabled="true"' + tooltip + tapAction + '>' +
        item.label + '</button>';
    } else {
      menuH += '<button class="status-menu-item" onclick="' + item.action + '"' + tooltip + '>' +
        item.label + '</button>';
    }
  });
  menuH += '</div></div>';
  return menuH;
}

/**
 * 無効化されたメニュー項目がクリックされた時、理由をトーストで表示する
 * メニュー自体が閉じないように伝播は止める
 * @param {Event} e - クリックイベント
 * @param {string} reason - 表示する理由
 */
function showDisabledReason_(e, reason) {
  if (e) e.stopPropagation();
  if (reason) showToast(reason, true);
}

/**
 * ステータスバッジ横に表示する「次のアクションに必要な条件」のヒント文言を返す
 * 三点メニューを開かなくても、何が足りないかユーザーが気づけるようにする
 * @param {string} status - 現在のイベントステータス
 * @return {string} ヒント文言（該当なしなら空文字）
 */
function buildStatusHint_(status) {
  var items = getStatusMenuItems_(status);
  var reasons = items
    .filter(function(it) { return it.disabled && it.tooltip; })
    .map(function(it) { return it.tooltip; });
  return reasons.length > 0 ? reasons.join(' / ') : '';
}

/**
 * ステータスに応じたメニュー項目を取得する
 * @param {string} status - 現在のステータス
 * @return {Object[]} メニュー項目配列
 */
function getStatusMenuItems_(status) {
  if (status === '準備中') {
    var hasEnoughMembers = currentMembers && currentMembers.length >= 2;
    return [{
      label: 'イベントを開始する',
      action: 'doStartEvent()',
      disabled: !hasEnoughMembers,
      tooltip: hasEnoughMembers ? '' : 'メンバーを2名以上登録してください'
    }];
  }
  if (status === '進行中') {
    var canEnd = canEndEvent_();
    return [{
      label: 'イベント終了',
      action: 'doEndEvent()',
      disabled: !canEnd,
      tooltip: canEnd ? '' : 'イベントを終了するには先にラウンドを終了してください'
    }];
  }
  if (status === 'イベント終了') {
    return [
      { label: '進行中に戻す', action: 'doReopenEvent()' }
    ];
  }
  return [];
}

/** 三点メニューの開閉 */
function toggleStatusMenu(e) {
  e.stopPropagation();
  var menu = document.getElementById('status-menu');
  if (menu) {
    menu.classList.toggle('open');
  }
}

/** メニュー外クリックで閉じる */
document.addEventListener('click', function() {
  var menu = document.getElementById('status-menu');
  if (menu) menu.classList.remove('open');
});

/**
 * イベントを終了できるかチェックする
 * 進行中のラウンドが1つでもあれば終了不可
 * @return {boolean}
 */
function canEndEvent_() {
  if (!cachedRounds || cachedRounds.length === 0) return false;
  return !cachedRounds.some(function(r) { return r.status !== '終了'; });
}

/**
 * ステータス遷移の確認→実行を行う共通処理
 * @param {string} title - 確認ダイアログのタイトル
 * @param {string} message - 確認メッセージ
 * @param {string} serverFunc - サーバー関数名
 * @param {string} confirmLabel - 確認ボタンのラベル
 */
function confirmStatusChange_(title, message, serverFunc, confirmLabel) {
  showConfirm(title, message, function() {
    callServer(serverFunc, [currentEventId], function(r) {
      showToast(r.message, !r.success);
      if (r.success) openEvent(currentEventId);
    });
  }, confirmLabel);
}

function doEndEvent() {
  confirmStatusChange_('イベント終了', 'イベントを終了しますか？MVP選出が可能になります。', 'endEvent', '終了する');
}

function doStartEvent() {
  if (!currentMembers || currentMembers.length < 2) {
    showToast('メンバーを2名以上登録してからイベントを開始してください', true);
    return;
  }
  confirmStatusChange_('イベント開始', 'イベントを進行中にしますか？チーム分けと試合が可能になります。', 'startEvent', '開始する');
}

function doReopenEvent() {
  confirmStatusChange_('差戻確認', 'イベントを進行中に戻しますか？ラウンドや試合を追加できるようになります。', 'reopenEvent', '差戻');
}

// ===================================
// アンケート
// ===================================
var cachedSurveyVoters = [];

/**
 * アンケートリンクを描画する
 * @param {Object} ev - イベントオブジェクト
 */
function renderSurveyLink(ev) {
  var c = document.getElementById('ev-survey-area');
  if (!c) return;

  var status = ev['ステータス'] || '準備中';
  var formUrl = ev['フォームURL'] || '';
  var hasMembers = currentMembers && currentMembers.length > 0;

  var h = '';

  if (status === '準備中') {
    // 準備中: 作成/再作成ボタンのみ（管理者のみ）
    if (isAdmin() && hasMembers) {
      var label = formUrl ? 'アンケート再作成' : 'アンケート作成';
      var action = formUrl ? 'recreateSurvey()' : 'createSurvey()';
      h += '<button class="btn btn-sm btn-secondary" onclick="' + action + '">' +
        svg(IC.file, 14) + ' ' + label + '</button>';
    }
  } else if (formUrl) {
    // 進行中〜: 回答リンク + 再作成（管理者のみ）
    h += '<a href="' + esc(formUrl) + '" target="_blank" class="survey-link-compact">' +
      svg(IC.file, 14) + ' アンケートに回答</a>';
    if (isAdmin()) {
      h += '<a href="javascript:void(0)" class="survey-recreate-link" onclick="recreateSurvey()">再作成</a>';
    }
  } else if (isAdmin() && hasMembers) {
    // 進行中〜 + 未作成: 作成ボタン（管理者のみ）
    h += '<button class="btn btn-sm btn-secondary" onclick="createSurvey()">' +
      svg(IC.file, 14) + ' アンケート作成</button>';
  }

  c.innerHTML = h;
}

/** アンケートフォームを作成/再作成する共通処理 */
function doCreateSurvey_() {
  callServer('createSurveyForm', [currentEventId], function(r) {
    if (r.success) { showToast(r.message); openEvent(currentEventId); }
    else { showToast(r.message, true); }
  });
}

function createSurvey() { doCreateSurvey_(); }

function recreateSurvey() {
  showConfirm('アンケート再作成', 'メンバーを追加した場合は再作成が必要です。既存の回答は引き継がれません。再作成しますか？', function() {
    doCreateSurvey_();
  }, '再作成');
}

// ===================================
// イベントURL共有
// ===================================

/** アプリURLのキャッシュ */
var cachedAppUrl_ = null;

/**
 * イベント招待URLをクリップボードにコピーする
 * @param {string} code - イベント参加コード
 */
function copyEventUrl(code) {
  if (cachedAppUrl_) {
    doCopyEventUrl_(cachedAppUrl_, code);
  } else {
    google.script.run
      .withSuccessHandler(function(url) {
        cachedAppUrl_ = url;
        doCopyEventUrl_(url, code);
      })
      .withFailureHandler(function() {
        // フォールバック: コードだけコピー
        copyToClipboard_(code).then(function() {
          showToast('参加コードをコピーしました 📋');
        });
      })
      .getAppUrl();
  }
}

function doCopyEventUrl_(baseUrl, code) {
  var url = baseUrl + '?code=' + encodeURIComponent(code);
  copyToClipboard_(url).then(function(ok) {
    if (ok) {
      showToast('招待URLをコピーしました 📋');
    } else {
      showToast('コピーに失敗しました', true);
    }
  });
}
</script>
