<script>
// ===================================
// ログイン・ロール管理
// ===================================

// ===================================
// セッション管理
// ===================================

/**
 * ログイン状態をlocalStorageに保存する
 */
function saveSession_() {
  try {
    var data = { role: currentRole, eventId: currentEventId, memberId: currentMemberId, ts: Date.now() };
    localStorage.setItem('futsal_session', JSON.stringify(data));
  } catch (e) { /* localStorage使用不可の場合は無視 */ }
}

/**
 * localStorageからログイン状態を復元する
 * @return {Object|null} { role, eventId } または期限切れ/未保存の場合null
 */
function loadSession_() {
  try {
    var raw = localStorage.getItem('futsal_session');
    if (!raw) return null;
    var data = JSON.parse(raw);
    if (!data.role || !data.ts) return null;
    if (Date.now() - data.ts > SESSION_TTL_) {
      localStorage.removeItem('futsal_session');
      return null;
    }
    return { role: data.role, eventId: data.eventId || null, memberId: data.memberId || null };
  } catch (e) { return null; }
}

/**
 * localStorageのセッションを削除する
 */
function clearSession_() {
  try { localStorage.removeItem('futsal_session'); } catch (e) { /* 無視 */ }
}

// ===================================
// ロール管理
// ===================================

/**
 * ロールを設定し、bodyクラスでUI出し分けを制御する
 * @param {string} role - 'admin' or 'user'
 */
function setRole_(role) {
  currentRole = role;
  document.body.classList.remove('role-admin', 'role-user');
  if (role) {
    document.body.classList.add('role-' + role);
  }
  // ヘッダーのログアウトボタン表示制御
  var logoutBtn = document.getElementById('btn-logout');
  if (logoutBtn) {
    logoutBtn.style.display = role ? 'flex' : 'none';
  }
}

/**
 * 現在のロールが管理者かどうか
 * @return {boolean}
 */
function isAdmin() {
  return currentRole === 'admin';
}

// ===================================
// ログイン処理
// ===================================

/** 管理者ログイン */
function doLoginAdmin() {
  var password = document.getElementById('login-password').value;
  if (!password) { showToast('パスワードを入力してください 🔑', true); return; }
  callServer('loginAdmin', [password], function(r) {
    if (r.success) {
      setRole_('admin');
      saveSession_();
      showPage('events');
    } else {
      showToast(r.message, true);
    }
  }, 'ログインに失敗しました');
}

/**
 * URLパラメータの参加コードで自動ログインする
 * @param {string} code - 参加コード
 */
function autoLoginWithCode_(code) {
  if (!code) { showPage('login', true); return; }
  showLoading('イベントに参加中...');
  google.script.run
    .withSuccessHandler(function(r) {
      hideLoading();
      if (r.success) {
        setRole_('user');
        currentEventId = r.eventId;
        showMemberSelect_(r.members || []);
      } else {
        showToast(r.message, true);
        showPage('login', true);
      }
    })
    .withFailureHandler(function() {
      hideLoading();
      showToast('ログインに失敗しました', true);
      showPage('login', true);
    })
    .loginWithCode(code);
}

/** イベントコードでログイン → メンバー選択画面を表示 */
function doLoginWithCode() {
  var code = document.getElementById('login-code').value;
  if (!code) { showToast('参加コードを入力してね', true); return; }
  callServer('loginWithCode', [code], function(r) {
    if (r.success) {
      setRole_('user');
      currentEventId = r.eventId;
      showMemberSelect_(r.members || []);
    } else {
      showToast(r.message, true);
    }
  }, 'ログインに失敗しました');
}

/**
 * メンバー選択画面を表示する
 * @param {Object[]} members - メンバー配列
 */
function showMemberSelect_(members) {
  var c = document.getElementById('member-select-list');
  if (!members || members.length === 0) {
    c.innerHTML = '<div class="empty-state"><p>メンバーがまだ登録されていません</p></div>';
    showPage('member-select');
    return;
  }
  c.innerHTML = members.map(function(m) {
    var orgAttr = m['幹事'] === 'はい' ? ' data-organizer="' + m['メンバーID'] + '"' : '';
    return '<div class="event-item"' + orgAttr + ' onclick="selectMyMember(\'' + m['メンバーID'] + '\')">' +
      '<div class="event-info"><div class="event-name">' + esc(m['名前']) +
      (m['幹事'] === 'はい' ? ' <span style="font-size:0.8rem;">👔</span>' : '') +
      '</div></div></div>';
  }).join('');
  showPage('member-select');
}

/**
 * メンバーを選択してイベント詳細に遷移する
 * 幹事の場合はパスワード入力を求める
 * @param {string} memberId - 選択したメンバーID
 */
function selectMyMember(memberId) {
  // 幹事チェック
  var el = document.querySelector('#member-select-list [data-organizer="' + memberId + '"]');
  if (el) {
    // 幹事 → パスワード入力モーダルを表示
    showOrganizerPasswordPrompt_(memberId);
  } else {
    // 一般メンバー → そのまま遷移
    currentMemberId = memberId;
    saveSession_();
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    document.getElementById('page-events').classList.add('active');
    openEvent(currentEventId);
  }
}

/**
 * 幹事パスワード入力モーダルを表示する
 * @param {string} memberId - 幹事のメンバーID
 */
function showOrganizerPasswordPrompt_(memberId) {
  var container = document.getElementById('modal-container');
  container.innerHTML = '<div class="modal-overlay" id="modal-overlay">' +
    '<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="org-pw-title">' +
    '<h3 id="org-pw-title">幹事パスワード</h3>' +
    '<p style="font-size:0.85rem;color:var(--text-muted);">幹事としてログインするにはパスワードを入力してください</p>' +
    '<div class="input-group" style="margin:12px 0;">' +
    '<input type="password" id="org-pw-input" placeholder="パスワード" class="input" maxlength="30">' +
    '</div>' +
    '<div class="modal-actions">' +
    '<button class="btn btn-secondary" onclick="closeOrgPasswordModal_()">キャンセル</button>' +
    '<button class="btn btn-primary" onclick="submitOrgPassword_(\'' + memberId + '\')">ログイン</button>' +
    '</div></div></div>';
  document.getElementById('modal-overlay').onclick = function(e) {
    if (e.target === this) closeOrgPasswordModal_();
  };
  setTimeout(function() {
    var input = document.getElementById('org-pw-input');
    if (input) {
      input.focus();
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); submitOrgPassword_(memberId); }
      });
    }
  }, 50);
}

function closeOrgPasswordModal_() {
  document.getElementById('modal-container').innerHTML = '';
}

/**
 * 幹事パスワードを送信して認証する
 * @param {string} memberId - 幹事のメンバーID
 */
function submitOrgPassword_(memberId) {
  var input = document.getElementById('org-pw-input');
  var password = input ? input.value.trim() : '';
  if (!password) { showToast('パスワードを入力してください', true); return; }

  callServer('loginAsOrganizer', [currentEventId, password], function(r) {
    if (r.success) {
      closeOrgPasswordModal_();
      currentMemberId = memberId;
      setRole_('admin');
      saveSession_();
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      document.getElementById('page-events').classList.add('active');
      openEvent(currentEventId);
    } else {
      showToast(r.message, true);
    }
  }, '認証に失敗しました');
}
}

/** 管理者ログインフォームの表示切り替え */
function toggleAdminLogin() {
  var form = document.getElementById('admin-login-form');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  if (form.style.display === 'block') {
    document.getElementById('login-password').focus();
  }
}

// ===================================
// イベント作成フロー（管理者・幹事共通）
// ===================================

/** 作成完了後に「イベントに進む」で使う一時データ */
var pendingCreatedEvent_ = null;

/**
 * イベント作成フォーム画面を表示する
 * 未ログインなら幹事として、管理者ログイン中なら管理者として作成する
 */
function showCreateEventForm() {
  // 日付フィールドに今日を初期値としてセット
  var dateInput = document.getElementById('create-ev-date');
  if (dateInput && !dateInput.value) {
    var t = new Date();
    dateInput.value = t.getFullYear() + '-' +
      String(t.getMonth() + 1).padStart(2, '0') + '-' +
      String(t.getDate()).padStart(2, '0');
  }
  showPage('create-event');
  setTimeout(function() {
    var nameInput = document.getElementById('create-ev-organizer');
    if (nameInput) nameInput.focus();
  }, 50);
}

/** ログイン画面に戻る */
function backToLogin() {
  showPage('login');
}

/**
 * 作成フォームから戻る
 * 管理者ログイン中ならイベント一覧へ、それ以外はログイン画面へ
 */
function backFromCreateEvent() {
  if (isAdmin() && !currentMemberId) {
    showPage('events');
  } else {
    showPage('login');
  }
}

/** イベントを作成する（管理者・幹事共通） */
function doCreateEventAsOrganizer() {
  var name = document.getElementById('create-ev-name').value.trim();
  var date = document.getElementById('create-ev-date').value;
  var organizer = document.getElementById('create-ev-organizer').value.trim();
  var emailEl = document.getElementById('create-ev-email');
  var email = emailEl ? emailEl.value.trim() : '';
  var passwordEl = document.getElementById('create-ev-password');
  var password = passwordEl ? passwordEl.value.trim() : '';

  if (!name) { showToast('イベント名を入力してください', true); return; }
  if (!date) { showToast('日付を選んでください', true); return; }
  if (!organizer) { showToast('幹事の名前を入力してください', true); return; }
  if (!password) { showToast('幹事パスワードを設定してください', true); return; }
  // メアドは任意。入力された場合のみ簡易バリデーション
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showToast('メールアドレスの形式が正しくありません', true);
    return;
  }

  callServer('createEventAsOrganizer', [name, date, organizer, email, password], function(r) {
    if (!r.success) {
      showToast(r.message, true);
      return;
    }
    // 作成完了画面に遷移し、参加コードを表示
    pendingCreatedEvent_ = {
      eventId: r.eventId,
      code: r.code,
      memberId: r.organizerMemberId,
      // 管理者ログイン済みなら admin として入室、未ログインなら幹事として入室
      asAdmin: isAdmin()
    };
    document.getElementById('created-event-code').textContent = r.code;
    // メール送信結果のフィードバック
    if (email) {
      if (r.emailSent) {
        showToast('参加コードをメールに送信しました 📧');
      } else {
        showToast('メール送信に失敗しましたが、イベントは作成できました', true);
      }
    }
    showPage('created-event');
  }, 'イベント作成に失敗しました');
}

/** 参加コードをクリップボードにコピー */
function copyEventCode() {
  var el = document.getElementById('created-event-code');
  if (!el) return;
  var code = (el.textContent || '').trim();
  if (!code || code === '----') return;
  copyToClipboard_(code).then(function(ok) {
    if (ok) {
      showToast('参加コードをコピーしました 📋');
    } else {
      showToast('コピーに失敗しました', true);
    }
  });
}

/** 作成完了画面から、イベント詳細に入る */
function enterCreatedEvent() {
  if (!pendingCreatedEvent_) {
    showPage('login');
    return;
  }

  var data = pendingCreatedEvent_;
  pendingCreatedEvent_ = null;

  if (data.asAdmin) {
    // 管理者として入室: 一覧に戻れる。currentMemberId は設定しない
    currentEventId = data.eventId;
    currentMemberId = null;
  } else {
    // 幹事として入室: 管理者権限を付与、そのイベント内のみ操作可能
    setRole_('admin');
    currentEventId = data.eventId;
    currentMemberId = data.memberId;
  }
  saveSession_();

  // 入力欄をクリア
  document.getElementById('create-ev-name').value = 'フットサル';
  document.getElementById('create-ev-date').value = '';
  document.getElementById('create-ev-organizer').value = '';
  var emailEl = document.getElementById('create-ev-email');
  if (emailEl) emailEl.value = '';
  var pwEl = document.getElementById('create-ev-password');
  if (pwEl) pwEl.value = '';

  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-events').classList.add('active');
  openEvent(currentEventId);
}

/** ログアウト */
function doLogout() {
  currentRole = null;
  currentEventId = null;
  currentMemberId = null;
  document.body.classList.remove('role-admin', 'role-user');
  clearSession_();
  // ヘッダーのログアウトボタンを非表示
  var logoutBtn = document.getElementById('btn-logout');
  if (logoutBtn) { logoutBtn.style.display = 'none'; }
  document.getElementById('login-code').value = '';
  document.getElementById('login-password').value = '';
  showPage('login');
}
</script>
